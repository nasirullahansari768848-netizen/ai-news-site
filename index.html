<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Updates Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d5dde8;--accent:#0f766e;--tag:#fde9b8;--tagink:#6b4a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1625;--card:#16213a;--ink:#e8eef8;--mute:#9db0cc;--line:#26344f;--accent:#4fd1c5;--tag:#3a2f10;--tagink:#f6d98a}}
:root[data-theme="dark"]{--bg:#0e1625;--card:#16213a;--ink:#e8eef8;--mute:#9db0cc;--line:#26344f;--accent:#4fd1c5;--tag:#3a2f10;--tagink:#f6d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{padding:28px 0 14px;border-bottom:3px solid var(--accent)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--mute);margin:0}
.date{color:var(--mute);font-size:14px;margin-top:6px}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
nav button{flex:none;font:inherit;font-size:14px;padding:6px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.tag{display:inline-block;background:var(--tag);color:var(--tagink);font-size:13px;padding:1px 10px;border-radius:6px}
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:20px;line-height:1.3;margin:8px 0}
article p{margin:0 0 10px}
.why{border-left:3px solid var(--accent);padding-left:12px;color:var(--mute)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.meta a{color:var(--accent);font-weight:600;text-decoration:none}
.empty{text-align:center;color:var(--mute);padding:40px 0}
footer{color:var(--mute);font-size:13px;text-align:center;padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>AI Updates Daily</h1>
<p class="sub">The latest AI news, summarized in plain English.</p>
<div class="date" id="date"></div>
</header>
<nav id="filters" aria-label="Categories"></nav>
<main id="list"><div class="empty">Loading news…</div></main>
<footer>Stories are collected and summarized automatically. Always check the original source for full details.</footer>
</div>
<script>
// Sample stories: news.json will replace these once the agent is running
var SAMPLE=[
{category:"Tools",title:"Sample story: a new AI tool for designers",summary:"This is a sample. A short, plain-English summary of the news will appear here.",why:"Why it matters: it could speed up everyday work.",source:"Sample source",url:"#",date:"2026-10-23"},
{category:"Research",title:"Sample story: smaller models get better",summary:"This is also a sample. The agent will collect and write real stories automatically.",why:"Why it matters: cheaper, faster AI is becoming possible.",source:"Sample source",url:"#",date:"2026-10-23"},
{category:"Companies",title:"Sample story: a big company launches a new model",summary:"Company announcements will be summarized here.",why:"Why it matters: new features may become available to you.",source:"Sample source",url:"#",date:"2026-10-22"}
];
var items=[],cur="All";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function safeUrl(u){return /^https?:\/\//.test(u)?u:"#"}
function render(){
  var cats=["All"];items.forEach(function(i){if(cats.indexOf(i.category)<0)cats.push(i.category)});
  document.getElementById("filters").innerHTML=cats.map(function(c){return '<button aria-pressed="'+(c===cur)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
  var shown=items.filter(function(i){return cur==="All"||i.category===cur});
  document.getElementById("list").innerHTML=shown.length?shown.map(function(i){
    return '<article><span class="tag">'+esc(i.category)+'</span><h2>'+esc(i.title)+'</h2><p>'+esc(i.summary)+'</p>'+(i.why?'<p class="why">'+esc(i.why)+'</p>':'')+'<div class="meta"><span>'+esc(i.source)+', '+esc(i.date)+'</span><a href="'+esc(safeUrl(i.url))+'" target="_blank" rel="noopener">Read original</a></div></article>'
  }).join(""):'<div class="empty">No stories in this category yet.</div>';
}
document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button");if(b){cur=b.getAttribute("data-c");render()}});
try{document.getElementById("date").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}catch(e){}
fetch("news.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){items=(d&&d.length)?d:SAMPLE;render()}).catch(function(){items=SAMPLE;render()});
</script>
</body>
</html>
